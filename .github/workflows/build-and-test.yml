name: build-and-test

# The merge gate for this repository. Merge Approval in the delivery harness requires the
# required checks on a pull request's head commit to be green, so this workflow is what makes
# a Greenhouse-Services pull request approvable at all.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# The gate only ever needs to read the tree it was handed.
permissions:
  contents: read

# Supersede in-flight runs for a pull request when it is pushed again, but never cancel a
# run on main — that one is the record for a merged commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    # Generous against a ~1 minute run; bounds a hung suite instead of holding a runner for 6h.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # Two SDKs, for two different reasons — do not reduce this to one:
          #   10.0.x — the CLI only understands the .slnx solution format from SDK 9.0.200 on.
          #            An 8.0.x CLI fails with MSB4068 before it reaches a single project.
          #   8.0.x  — supplies the .NET 8 runtime the net8.0 test assemblies execute against.
          # The projects' TargetFramework (net8.0) is set in the csproj files and does not
          # follow from which SDK builds them.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Greenhouse.slnx

      - name: Build
        # -warnaserror is what makes this strict: the solution builds with 0 warnings today, so
        # a warning-only regression is a real regression and should fail the gate rather than
        # scroll past in a log nobody opens.
        run: dotnet build Greenhouse.slnx --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test Greenhouse.slnx --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        # Runs even on failure — a red gate is when the results matter most.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
